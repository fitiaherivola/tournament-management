spring.application.name=tournament-management
server.port=8080

# Base de données H2 persistante sur fichier (remplaçable par PostgreSQL/MySQL)
spring.datasource.url=jdbc:h2:file:./tournoi;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.thymeleaf.cache=false
spring.web.locale=fr

# Pagination (Spring Data)
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# Paramètres métier
app.seed-demo-data=true
app.match-duration-minutes=90
app.default-slot-minutes=120
app.default-venue=Terrain 1
