<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tournoi')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('tournaments')}"></header>
<main class="container">
    <h1 th:text="${formTitle}">Tournoi</h1>
    <form class="card" th:action="@{${formAction}}" th:object="${form}" method="post">
        <div class="alert error" th:if="${#fields.hasErrors('*')}">
            <strong>Veuillez corriger les points suivants :</strong>
            <ul><li th:each="err : ${#fields.errors('*')}" th:text="${err}">Erreur</li></ul>
        </div>
        <div class="form-grid">
            <div class="field"><label for="name">Nom *</label>
                <input type="text" id="name" th:field="*{name}" maxlength="120"></div>
            <div class="field"><label for="sport">Sport *</label>
                <input type="text" id="sport" th:field="*{sport}" maxlength="60"></div>
            <div class="field"><label for="location">Lieu *</label>
                <input type="text" id="location" th:field="*{location}" maxlength="150"></div>
            <div class="field"><label for="type">Type de tournoi *</label>
                <select id="type" th:field="*{type}">
                    <option value="">Choisir…</option>
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.label}">Type</option>
                </select></div>
            <div class="field"><label for="startDate">Date de début *</label>
                <input type="date" id="startDate" th:field="*{startDate}"></div>
            <div class="field"><label for="endDate">Date de fin *</label>
                <input type="date" id="endDate" th:field="*{endDate}"></div>
            <div class="field"><label for="maxTeams">Nombre maximum d'équipes * (2 à 64)</label>
                <input type="number" id="maxTeams" th:field="*{maxTeams}" min="2" max="64"></div>
        </div>
        <div class="field"><label for="description">Description</label>
            <textarea id="description" th:field="*{description}" maxlength="2000"></textarea></div>
        <div class="actions">
            <button type="submit" class="btn">Enregistrer</button>
            <a class="btn secondary" th:href="@{/tournaments}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
