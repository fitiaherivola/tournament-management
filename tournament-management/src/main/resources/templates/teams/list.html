<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Équipes')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar('teams')}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: messages}"></div>
    <div class="page-head">
        <div><h1>Équipes</h1><p class="muted">Recherche, filtres, tri et pagination</p></div>
        <div class="actions" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
            <a class="btn" th:href="@{/teams/new}">Nouvelle équipe</a>
        </div>
    </div>
    <form class="filters card" th:action="@{/teams}" th:object="${filter}" method="get">
        <div class="field"><label for="search">Recherche</label>
            <input type="text" id="search" th:field="*{search}" placeholder="Nom, ville ou entraîneur"></div>
        <div class="field"><label for="city">Ville</label>
            <input type="text" id="city" th:field="*{city}"></div>
        <div class="field"><label for="status">Statut</label>
            <select id="status" th:field="*{status}">
                <option value="">Tous</option>
                <option th:each="s : ${teamStatuses}" th:value="${s}" th:text="${s.label}">Statut</option>
            </select></div>
        <div class="field"><label for="sort">Tri</label>
            <select id="sort" name="sort">
                <option value="name,asc" th:selected="${param.sort != null and param.sort[0] == 'name,asc'}">Nom (A → Z)</option>
                <option value="name,desc" th:selected="${param.sort != null and param.sort[0] == 'name,desc'}">Nom (Z → A)</option>
                <option value="city,asc" th:selected="${param.sort != null and param.sort[0] == 'city,asc'}">Ville</option>
            </select></div>
        <button class="btn" type="submit">Filtrer</button>
        <a class="btn secondary" th:href="@{/teams}">Réinitialiser</a>
    </form>
    <div class="table-wrap">
        <table>
            <thead><tr><th>Équipe</th><th>Ville</th><th>Entraîneur</th><th class="num">Joueurs</th><th>Statut</th><th></th></tr></thead>
            <tbody>
            <tr th:each="t : ${page.content}">
                <td><a th:href="@{/teams/{id}(id=${t.id})}" th:text="${t.name}">Équipe</a></td>
                <td th:text="${t.city}">Ville</td>
                <td th:text="${t.coach}">Entraîneur</td>
                <td class="num" th:text="${#lists.size(t.players)}">0</td>
                <td><span class="badge" th:classappend="${'badge-' + t.status.name().toLowerCase()}" th:text="${t.status.label}">Statut</span></td>
                <td class="actions" sec:authorize="hasAnyRole('ADMIN','MANAGER')">
                    <a class="btn small secondary" th:href="@{/teams/{id}/edit(id=${t.id})}">Modifier</a>
                    <form th:action="@{/teams/{id}/delete(id=${t.id})}" method="post"
                          onsubmit="return confirm('Supprimer cette équipe ?');">
                        <button class="btn small danger" type="submit">Supprimer</button></form>
                </td>
            </tr>
            <tr th:if="${page.empty}"><td colspan="6" class="muted">Aucune équipe ne correspond à la recherche.</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:replace="~{fragments/layout :: pager(${page}, ${path}, ${qs})}"></nav>
</main>
</body>
</html>
